name: Linux build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed, for example 1.2
        required: true
        default: "1.2"
  push:
    tags:
      - "V*"
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    permissions:
      contents: read
    env:
      ASTTE_VERSION: ${{ inputs.version || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            curl \
            git \
            gtk3 \
            imagemagick \
            libayatana-appindicator \
            librsvg \
            pkgconf \
            rustup \
            webkit2gtk-4.1 \
            xdotool

      - name: Install Rust
        run: |
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      - name: Build Linux release
        run: dx build --release

      - name: Verify libxdo ABI
        run: readelf -d target/dx/astte/release/linux/app/astte | grep -q 'libxdo.so.4'

      - name: Create AppImage metadata
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/dx/astte/release/linux/app/astte AppDir/usr/bin/astte
          convert assets/favicon.ico -resize 256x256 AppDir/usr/share/icons/hicolor/256x256/apps/astte.png
          cat > AppDir/astte.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=ASTTE
          Exec=astte
          Icon=astte
          Categories=Utility;
          Terminal=false
          EOF

      - name: Install linuxdeploy
        run: |
          curl -L \
            -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --library /usr/lib/libxdo.so.4 \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/astte.png \
            --desktop-file AppDir/astte.desktop \
            --output appimage
          mv ASTTE-x86_64.AppImage "ASTTE-${ASTTE_VERSION}-linux-x86_64.AppImage"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ASTTE-${{ env.ASTTE_VERSION }}-linux-x86_64
          path: ASTTE-${{ env.ASTTE_VERSION }}-linux-x86_64.AppImage
